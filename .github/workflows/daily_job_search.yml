name: Daily Job Search

# Основний щоденний тригер — ЗОВНІШНІЙ cron-job.org (POST workflow_dispatch
# о 9:00 Europe/Kyiv, див. SETUP.md крок 6). Внутрішній `schedule:` нижче —
# лише РЕЗЕРВ на випадок, якщо зовнішній тригер не спрацював (протермінований
# PAT тощо): GitHub-cron запізнюється на години, але подвійного звіту вже
# не буде — main.py виходить без звіту, якщо прогін за сьогодні вже був
# (data/last_run_date.txt, run_guard у config.yaml). Ручний запуск через
# "Run workflow" ставить FORCE_RUN=true і захист обходить.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Запустити, навіть якщо прогін за сьогодні вже був"
        type: boolean
        default: true
  schedule:
    # 08:30 UTC = 10:30 Kyiv влітку / 11:30 взимку — свідомо ПІСЛЯ основного
    # тригера, щоб у нормі просто вийти по run_guard.
    - cron: "30 8 * * *"

permissions:
  contents: write   # щоб закомітити оновлені data/*.json

# Два одночасні прогони (напр. зовнішній + резервний) не повинні
# змагатись за коміт data/ — другий чекає на перший.
concurrency:
  group: daily-job-search
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run job search agent
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORK_UA_EMAIL_ADDRESS: ${{ secrets.WORK_UA_EMAIL_ADDRESS }}
          WORK_UA_EMAIL_APP_PASSWORD: ${{ secrets.WORK_UA_EMAIL_APP_PASSWORD }}
          # workflow_dispatch: значення input'у force (за замовчуванням true);
          # schedule: input'ів немає -> порожньо -> run_guard активний.
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force || '' }}
        run: python src/main.py

      - name: Commit updated data files
        if: always()
        run: |
          git config user.name "job-search-agent-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Немає змін у data/ — коміт не потрібен."
            exit 0
          fi
          git commit -m "chore: update seen jobs [skip ci]"
          # Якщо main встигли оновити (інший прогін) — підтягуємо і пушимо знову.
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main || exit 1
          done
          exit 1
