name: Daily Job Search

# ЄДИНИЙ тригер — ЗОВНІШНІЙ сервіс cron-job.org, який щодня о 9:00
# Europe/Kyiv робить POST workflow_dispatch (див. SETUP.md, крок 6).
# Жодного внутрішнього `schedule:` тут НЕМАЄ і не повинно бути —
# GitHub-cron на цьому репозиторії ненадійний: запуски затримувались на
# 4-7+ годин (звіти о 15:00 і навіть 17:10 замість ранку), а тримати
# його як "резерв" паралельно із зовнішнім тригером лише ускладнює
# пайплайн (знадобився окремий захист від подвійного звіту) без
# реальної користі. Ручний запуск — Actions → Daily Job Search →
# Run workflow.
on:
  workflow_dispatch: {}

permissions:
  contents: write   # щоб закомітити оновлені data/*.json

# Захищає коміт data/ від конфлікту, якщо хтось запустить вручну, поки
# вже йде щоденний прогін від cron-job.org.
concurrency:
  group: daily-job-search
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run job search agent
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORK_UA_EMAIL_ADDRESS: ${{ secrets.WORK_UA_EMAIL_ADDRESS }}
          WORK_UA_EMAIL_APP_PASSWORD: ${{ secrets.WORK_UA_EMAIL_APP_PASSWORD }}
        run: python src/main.py

      - name: Commit updated data files
        if: always()
        run: |
          git config user.name "job-search-agent-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Немає змін у data/ — коміт не потрібен."
            exit 0
          fi
          git commit -m "chore: update seen jobs [skip ci]"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main || exit 1
          done
          exit 1
