name: Daily Job Search

# ВАЖЛИВО: внутрішній розклад GitHub Actions (`schedule:`) навмисно
# ВИДАЛЕНО. GitHub Actions cron ненадійний для цього репо — реальні
# запуски затримувались на 4–7+ годин відносно заданого часу (ціль
# 9:00-10:00 Київ фактично стартувала о 14:55-17:10), і без окремого
# захисту від подвійного запуску це спричиняло ДВА звіти на день:
# один вчасно (через зовнішній тригер), другий — із затримкою (через
# внутрішній GitHub cron).
#
# Єдиний спосіб запуску тепер — workflow_dispatch. Щоденний тригер
# о 9:00 Europe/Kyiv живе ПОЗА цим репозиторієм: зовнішній сервіс
# cron-job.org раз на день робить
#   POST /repos/<owner>/<repo>/actions/workflows/daily_job_search.yml/dispatches
# з тілом {"ref": "main"} — це і запускає джоб нижче. Налаштування
# самого cron-job.org зберігаються на його стороні, не тут.
# Ручний запуск лишається доступним так само — Actions → Daily Job
# Search → Run workflow.
on:
  workflow_dispatch: {}

permissions:
  contents: write   # потрібно, щоб закомітити оновлений data/seen_jobs.json

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job search agent
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORK_UA_EMAIL_ADDRESS: ${{ secrets.WORK_UA_EMAIL_ADDRESS }}
          WORK_UA_EMAIL_APP_PASSWORD: ${{ secrets.WORK_UA_EMAIL_APP_PASSWORD }}
        run: python src/main.py

      - name: Commit updated seen_jobs.json
        run: |
          git config user.name "job-search-agent-bot"
          git config user.email "actions@github.com"
          git add data/seen_jobs.json
          git diff --staged --quiet || git commit -m "chore: update seen jobs [skip ci]"
          git push
