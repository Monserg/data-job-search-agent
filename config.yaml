# ==========================================================
# Конфігурація агента пошуку вакансій
# ==========================================================
#
# Пошук організовано в ПРОФІЛІ (profiles): кожен профіль — окремий
# напрямок пошуку зі своїми запитами, правилами відсіювання, аркушем у
# Google Sheets і хештегом у Telegram. Профілі проходять один спільний
# список "вже бачених" вакансій (data/seen_jobs.json).
#
# Поля профілю:
#   name               — назва для заголовків у Telegram
#   hashtag            — хештег у картці Telegram
#   worksheet          — аркуш у Google Sheets (створюється автоматично)
#   sheet_first_data_row — з якого рядка аркуша починаються дані
#                        (за замовчуванням 2 — одразу під заголовком;
#                        3 — якщо в рядку 2 стоять фільтри по колонках).
#                        Вище цього рядка код нічого не пише.
#   queries            — текстові запити для джерел, що шукають за текстом
#                        (RemoteOK, WeWorkRemotely, Remotive, Himalayas,
#                        NoFluffJobs, JustRemote, DOU без category, Djinni
#                        без primary_keyword, Just Join IT без categories).
#                        1-2 слова = точна фраза,
#                        3+ слів = усі слова присутні (див. base.py).
#   title_regex        — тематичний гейт: regex МАЄ збігтися з НАЗВОЮ
#                        вакансії, інакше вона відкидається (для всіх
#                        джерел, включно з email-сповіщеннями).
#   title_reject_regex — regex, збіг якого з назвою ВІДКИДАЄ вакансію
#                        (суміжні напрямки: Android для iOS тощо).
#   exclude_title      — стоп-слова, що шукаються лише в НАЗВІ
#                        (сеньйорність: "Senior", "Lead" ...). Пошук з
#                        межами слова: "Lead" не збігається з "leadership".
#   exclude_text       — стоп-фрази, що шукаються в назві + описі
#                        (вимоги "3+ years", рівень англійської тощо).
#   sources            — параметри фільтрації НА БОЦІ джерела для
#                        конкретних скраперів (див. docstring кожного
#                        скрапера). enabled: false вимикає джерело лише
#                        для цього профілю.
#
# Email-джерела (work_ua_email, robota_ua_email, linkedin_email) не
# залежать від профілю: на кожен профіль створюється окремий збережений
# пошук / Job alert на ту саму скриньку, а вакансія з листа потрапляє в
# профіль, чий title_regex збігся з її назвою.

profiles:

  # ----------------------------------------------------------------
  # 1. AI / LLM — Junior / Entry level
  # ----------------------------------------------------------------
  ai_junior:
    name: "AI Junior"
    hashtag: "#AI"
    worksheet: "Vacancies"

    queries:
      - "Junior AI Engineer"
      - "Junior LLM Engineer"
      - "Entry Level AI Engineer"
      - "Junior Prompt Engineer"
      - "Associate AI Developer"
      - "Junior GenAI Engineer"
      - "Junior Python AI Developer"
      - "Python Developer LangChain"
      - "Python Developer RAG"
      - "Junior RAG Engineer"
      - "LLM Application Developer"
      - "AI Engineer"
      - "Prompt Engineer"

    # AI/ML-маркер має бути в назві. "agent" навмисно НЕ включено:
    # "Customer Support Agent" / "Sales Agent" проходили як AI.
    title_regex: |-
      (?<![a-z0-9])(ai|llm|llms|genai|gen[\s-]?ai|ml|mlops|nlp|rag|langchain|
      machine[\s-]+learning|deep[\s-]+learning|generative|artificial[\s-]+intelligence|
      prompt|agentic|ai[\s-]+agents?|copilot|
      аі|ші|штучн\w*|машинн\w*\s+навчан\w*)(?![a-z0-9])
    title_reject_regex: ""

    exclude_title:
      - "Senior"
      - "Sr."
      - "Sr"
      - "Lead"
      - "Principal"
      - "Staff"
      - "Head of"
      - "Director"
      - "Manager"
      - "Architect"
      - "Middle"

    exclude_text:
      # Роки досвіду
      - "2+ years"
      - "3+ years"
      - "4+ years"
      - "5+ years"
      - "2-4 years"
      - "3-5 years"
      - "minimum 2 years"
      - "minimum 3 years"
      - "at least 2 years"
      - "at least 3 years"
      - "1+ year"
      - "1+ years"
      - "1-2 years"
      - "minimum 1 year"
      - "at least 1 year"
      - "from 1 year"
      - "only from 1 year"
      - "1 year of experience"
      - "1 year experience"
      - "від 1 року"
      - "від 1-го року"
      - "мінімум 1 рік"
      - "1 рік досвіду"
      # Науковий ступінь
      - "PhD"
      - "Ph.D."
      # Рівень англійської B2 і вище
      - "English B2"
      - "B2 - Upper Intermediate"
      - "B2 Upper Intermediate"
      - "Upper-Intermediate"
      - "Англійська B2"
      - "англійська на рівні B2"

    sources:
      djinni:
        # Категорія Djinni "ML AI" + рівні досвіду без досвіду / до 1 року.
        # Кожен exp_level — окремий запит (Djinni не приймає список).
        primary_keyword: "ML AI"
        exp_level: ["no_exp", "1y"]
      dou:
        # DOU шукає за queries; досвід 0-1 та 1-3 роки.
        exp: ["0-1", "1-3"]
      nofluffjobs:
        # Теги NFJ + рівні; вакансії переважно з Польщі (remote).
        requirement: ["AI", "LLM", "Machine Learning"]
        seniority: ["Trainee", "Junior"]
      justjoin:
        # Категорії Just Join IT (ai/data/python) × рівень junior — один
        # запит на кожну пару. Лише remote (хочеш і гібрид у Польщі —
        # додай "hybrid"). Опис довантажується, бо exclude_text профілю
        # перевіряє роки досвіду / рівень англійської; max_age_days
        # обмежує кількість таких довантажень.
        categories: ["ai", "data", "python"]
        experience_levels: ["junior"]
        workplace_types: ["remote"]
        max_age_days: 14
        with_description: true

  # ----------------------------------------------------------------
  # 2. iOS Developer — Middle+ / Senior
  # ----------------------------------------------------------------
  ios_middle_senior:
    name: "iOS Middle+/Senior"
    hashtag: "#iOS"
    worksheet: "Vacancies-iOS"

    queries:
      - "iOS Developer"
      - "iOS Engineer"
      - "Swift Developer"
      - "Swift Engineer"
      - "SwiftUI Developer"
      - "Mobile Developer iOS"
      - "Mobile Engineer iOS"

    title_regex: "(?<![a-z0-9])(ios|swift|swiftui|iphone|ipados)(?![a-z0-9])"
    # Суміжні напрямки та не-розробницькі ролі, де "iOS" теж є в назві
    # (реальні приклади з фіду Djinni: "Tech Support Android / iOS",
    # "Senior ASO Specialist (iOS)").
    title_reject_regex: |-
      (?<![a-z0-9])(android|flutter|react[\s-]*native|kotlin|xamarin|
      qa|tester|testing|automation|support|aso|recruiter|designer|
      marketing|manager|product owner|analyst)(?![a-z0-9])

    exclude_title:
      - "Junior"
      - "Trainee"
      - "Intern"
      - "Internship"
      - "Entry level"
      - "Entry-level"
      - "Стажер"
      - "Стажист"
      - "Молодший"
      - "Джуніор"

    # Вимоги "3+ years" тут норма, тому нічого не виключаємо.
    exclude_text: []

    sources:
      djinni:
        primary_keyword: "iOS"
        exp_level: ["3y", "5y"]
      dou:
        category: "iOS/macOS"
        exp: ["3-5", "5plus"]
      nofluffjobs:
        requirement: ["iOS", "Swift"]
        seniority: ["Mid", "Senior", "Expert"]
      justjoin:
        # Категорія mobile включає Android/Flutter — їх відсіює
        # title_reject_regex. Опис не потрібен (exclude_text порожній).
        categories: ["mobile"]
        experience_levels: ["mid", "senior"]
        workplace_types: ["remote"]
        max_age_days: 14

  # ----------------------------------------------------------------
  # 3. Frontend / Full-stack (React, TypeScript, Node) — Middle+ / Senior
  # ----------------------------------------------------------------
  # Джерело ключових слів: my_search_keywords.xlsx (аркуш з
  # фронтенд-запитами). До маркерів з таблиці (react, typescript, ts,
  # javascript, js, node, next, mern, nest) додано frontend/front-end,
  # fullstack/full-stack і варіанти з ".js" — інакше запити
  # "Senior Frontend Engineer" / "Full-stack Developer" не проходили б
  # тематичний гейт, бо в таких назвах технологія часто не згадується.
  frontend_senior:
    name: "Frontend/Full-stack Middle+/Senior"
    hashtag: "#Frontend"
    worksheet: "Vacancies-Frontend"
    # Рядок 1 — заголовок, рядок 2 — фільтри по колонках, дані з рядка 3.
    sheet_first_data_row: 3

    queries:
      # З таблиці
      - "Frontend Engineer"
      - "Front-end Engineer"
      - "Senior Front-end Engineer"
      - "Senior Frontend Engineer"
      - "Senior Frontend Developer"
      - "Senior Front-end Developer"
      - "Full-stack Developer"
      - "Full-stack Engineer"
      - "Senior React Developer"
      - "Senior React Engineer"
      # Варіанти написання (1-2 слова = точна фраза, тому "Full-stack"
      # не збігається з "Full Stack" / "Fullstack")
      - "Frontend Developer"
      - "Front-end Developer"
      - "Front End Engineer"
      - "Front End Developer"
      - "Full Stack Developer"
      - "Full Stack Engineer"
      - "Fullstack Developer"
      - "Fullstack Engineer"
      - "React Developer"
      - "React Engineer"
      - "TypeScript Developer"
      - "TypeScript Engineer"
      - "Node.js Developer"
      - "Node.js Engineer"
      - "Next.js Developer"

    # Маркер стеку або напрямку має бути в назві.
    title_regex: |-
      (?<![a-z0-9])(react|react\.?js|typescript|ts|javascript|js|
      node|node\.?js|next|next\.?js|nest|nest\.?js|mern|
      frontend|front[\s-]+end|fullstack|full[\s-]+stack|
      фронтенд|фронт[\s-]+енд|фулстек|фул[\s-]+стек)(?![a-z0-9])
    # Інші фронтенд-фреймворки (напрямок — React/TypeScript/Node),
    # мобільна розробка (React Native / Flutter), CMS-платформи та
    # не-розробницькі ролі, де "frontend"/"js" теж буває в назві
    # (реальні приклади з прогону 2026-10-01: "React Native Developer",
    # "Senior AQA Engineer (TypeScript + Node.js)", "Full-Stack Shopify
    # Developer", "Magento Frontend Developer").
    # Інший бекенд-стек у назві (.NET/Java/PHP/Python/Rails/Go...) теж
    # відкидається: напрямок — JS/TS і на фронті, і на беку (рішення
    # 2026-10-01; таких було 77 із 297 у першому прогоні). Чисто
    # бекендові Node.js/Nest-вакансії та "Lead" навмисно лишаються.
    title_reject_regex: |-
      (?<![a-z0-9])(angular|vue|vue\.?js|nuxt|svelte|
      react[\s-]*native|flutter|
      wordpress|drupal|magento|shopify|
      \.net|dotnet|c#|csharp|java(?!script)|kotlin|scala|
      php|laravel|symfony|python|django|fastapi|
      ruby|rails|golang|go|rust|elixir|
      qa|aqa|tester|testing|automation|support|recruiter|designer|
      marketing|manager|product owner|analyst|sales)(?![a-z0-9])

    exclude_title:
      # З таблиці
      - "Junior"
      - "Jr."
      - "Jr"
      - "Principal"
      - "Staff"
      - "Director"
      - "Manager"
      - "Architect"
      # Як в iOS-профілі: стажування та українські варіанти
      - "Trainee"
      - "Intern"
      - "Internship"
      - "Entry level"
      - "Entry-level"
      - "Стажер"
      - "Стажист"
      - "Молодший"
      - "Джуніор"

    exclude_text:
      - "PhD"
      - "Ph.D."

    sources:
      djinni:
        # Перевірено 2026-10-01: категорія фронтенду на Djinni зветься
        # "JavaScript"; "React" / "Front-End" Djinni не знає і віддає
        # ВЕСЬ фід. "Node.js" — переважно бекенд, лишаються лише назви
        # з маркером (NodeJS/Nest/Fullstack). Один запит на кожну пару
        # категорія × рівень.
        primary_keyword: ["JavaScript", "Fullstack", "Node.js"]
        exp_level: ["3y", "5y"]
      dou:
        # "Front End" є у списку категорій DOU; "Full Stack" у списку
        # немає, але параметр працює (перевірено 2026-10-01).
        category: ["Front End", "Full Stack"]
        exp: ["3-5", "5plus"]
      nofluffjobs:
        requirement: ["React", "TypeScript", "JavaScript", "Node.js", "Next.js"]
        seniority: ["Mid", "Senior", "Expert"]
      justjoin:
        # Категорія javascript включає Angular/Vue/бекенд — їх відсіює
        # title_regex / title_reject_regex. Опис не довантажується:
        # єдина стоп-фраза (PhD) у фронтенд-вакансіях майже не
        # трапляється, а довантаження — по запиту на кожну вакансію.
        categories: ["javascript"]
        experience_levels: ["mid", "senior"]
        workplace_types: ["remote"]
        max_age_days: 14

# Джерела, які потрібно опитувати. enabled: false вимикає джерело для
# всіх профілів, якщо його розмітка зламалась.
sources:
  djinni:
    enabled: true
  dou:
    enabled: true
  remoteok:
    enabled: true
  weworkremotely:
    enabled: true
  robota_ua_email:
    enabled: true
  work_ua_email:
    enabled: true
  nofluffjobs:
    enabled: true
  justjoin:
    enabled: true
  justremote:
    enabled: true
  indeed:
    enabled: false   # заглушка: безкоштовного стабільного шляху немає
  linkedin_email:
    enabled: true
  remotive:
    enabled: true
  himalayas:
    enabled: true

# Google Sheets, куди пишеться таблиця (колонки A-E: дата, назва,
# компанія, джерело, посилання). Аркуш задається профілем (worksheet).
# Колонки правіше E заповнюються вручну, код їх не чіпає.
google_sheets:
  spreadsheet_id: "1RYP2ub_m7sCtag-MLuZKeukyUhn9WkzvMRKnZ52jeDw"

# Здоров'я джерел: якщо джерело N днів поспіль повертає 0 вакансій ще
# ДО фільтрації — у Telegram надсилається попередження. Для email-джерел
# поріг вищий (0 нових листів кілька днів — норма).
health:
  zero_days_warn: 3
  zero_days_warn_email: 7
