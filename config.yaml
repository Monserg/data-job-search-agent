# ==========================================================
# Конфігурація агента пошуку вакансій
# ==========================================================

# ==============================================================================
# SEARCH CONFIGURATION
# ==============================================================================
search:
  queries:
    # 1. Direct Junior/Entry AI & LLM Roles
    - "Junior AI Engineer"
    - "Junior LLM Engineer"
    - "Entry Level AI Engineer"
    - "Junior Prompt Engineer"
    - "Associate AI Developer"
    - "Junior GenAI Engineer"

    # 2. Applied Python & Frameworks
    - "Junior Python AI Developer"
    - "Python Developer LangChain"
    - "Python Developer RAG"
    - "Junior RAG Engineer"
    - "LLM Application Developer"

    # 3. General (Requires strict exclude_keywords filtering below)
    - "AI Engineer"
    - "Prompt Engineer"

  # ПРИМІТКА: experience_levels і max_years_experience тут поки суто
  # довідкові. Наші джерела віддають лише заголовок+опис вакансії, без
  # структурованого поля "рівень досвіду" чи "роки досвіду" — тому
  # реальне відсіювання за досвідом відбувається через filters.exclude_keywords
  # нижче (наприклад "5+ years", "Senior"), а не через ці два поля.
  experience_levels:
    - "Entry level"
    - "Associate"
    - "Internship"

  # Max experience threshold for internal parser/LLM evaluation
  max_years_experience: 1.0

# ==============================================================================
# EXCLUSION & FILTERING RULES
# ==============================================================================
filters:
  exclude_keywords:
    # Seniority Titles
    - "Senior"
    - "Sr."
    - "Lead"
    - "Principal"
    - "Staff"
    - "Head of"
    - "Director"
    - "Manager"
    - "Architect"

    # Strict Experience Phrases
    - "2+ years"
    - "3+ years"
    - "4+ years"
    - "5+ years"
    - "2-4 years"
    - "3-5 years"
    - "minimum 2 years"
    - "minimum 3 years"
    - "at least 2 years"
    - "at least 3 years"

    # Advanced Academic Requirements (if not relevant)
    - "PhD"
    - "Ph.D."

# Джерела, які потрібно опитувати. can_disable дозволяє швидко
# вимкнути джерело, якщо його розмітка зламалась, не видаляючи конфіг.
sources:
  djinni:
    enabled: true
  dou:
    enabled: true
  remoteok:
    enabled: true
  weworkremotely:
    enabled: true
  robota_ua:
    enabled: true
  work_ua:
    enabled: true
  nofluffjobs:
    enabled: true
  justremote:
    enabled: true
  indeed:
    enabled: true
  linkedin_alerts:
    enabled: true
  remotive:
    enabled: true
  himalayas:
    enabled: true    
    # Встав сюди RSS-посилання своїх Google Alerts (див. SETUP.md, крок 5).
    # Приклад запиту в Google Alerts: site:linkedin.com/jobs "data analyst" remote
feed_urls: ["https://www.google.com/alerts/feeds/перше", "https://www.google.com/alerts/feeds/друге", "https://www.google.com/alerts/feeds/третє"]

# Google Sheets, куди пишеться таблиця (колонки A-E: дата, назва,
# компанія, джерело, посилання). Match Score / CV / причина прибрані
# разом з усім шаром матчингу (2026-09-20). Колонки F-J (CANVA/EN/
# На адаптацію/Виконано/Feedback) заповнюються вручну.
google_sheets:
  spreadsheet_id: "1RYP2ub_m7sCtag-MLuZKeukyUhn9WkzvMRKnZ52jeDw"
  worksheet_name: "Vacancies"

telegram:
  # chat_id можна лишити порожнім і взяти з секрету TELEGRAM_CHAT_ID
  parse_mode: "HTML"

# Часове вікно звіту (для довідки; фактичний запуск керується GitHub Actions cron)
report_window:
  timezone: "Europe/Kyiv"
  start: "09:00"
  end: "10:00"
