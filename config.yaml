# ==========================================================
# Конфігурація агента пошуку вакансій
# ==========================================================

# ==============================================================================
# SEARCH CONFIGURATION
# ==============================================================================
search:
  queries:
    # 1. Direct Junior/Entry AI & LLM Roles
    - "Junior AI Engineer"
    - "Junior LLM Engineer"
    - "Entry Level AI Engineer"
    - "Junior Prompt Engineer"
    - "Associate AI Developer"
    - "Junior GenAI Engineer"

    # 2. Applied Python & Frameworks
    - "Junior Python AI Developer"
    - "Python Developer LangChain"
    - "Python Developer RAG"
    - "Junior RAG Engineer"
    - "LLM Application Developer"

    # 3. General (тепер справді "строго відфільтровані" — keyword_matches
    # вимагає точної фрази "AI Engineer"/"Prompt Engineer" як сусідніх
    # слів, а не підрядка будь-де в тексті; див. src/scrapers/base.py)
    - "AI Engineer"
    - "Prompt Engineer"

  # ПРИМІТКА: experience_levels і max_years_experience тут поки суто
  # довідкові. Наші джерела віддають лише заголовок+опис вакансії, без
  # структурованого поля "рівень досвіду" чи "роки досвіду" — тому
  # реальне відсіювання за досвідом відбувається через filters.exclude_keywords
  # нижче (наприклад "5+ years", "Senior"), а не через ці два поля.
  experience_levels:
    - "Entry level"
    - "Associate"
    - "Internship"

  # Max experience threshold for internal parser/LLM evaluation
  max_years_experience: 1.0

# ==============================================================================
# EXCLUSION & FILTERING RULES
# ==============================================================================
filters:
  exclude_keywords:
    # Seniority Titles
    - "Senior"
    - "Sr."
    - "Lead"
    - "Principal"
    - "Staff"
    - "Head of"
    - "Director"
    - "Manager"
    - "Architect"

    # Strict Experience Phrases
    - "2+ years"
    - "3+ years"
    - "4+ years"
    - "5+ years"
    - "2-4 years"
    - "3-5 years"
    - "minimum 2 years"
    - "minimum 3 years"
    - "at least 2 years"
    - "at least 3 years"

    # Experience Phrases — навіть "виключно від 1 року" (2026-09-22:
    # додано після https://djinni.co/jobs/849450-aws-net-c-ai-engineer/,
    # де на сторінці вакансії стояло "Only from 1 year of experience" +
    # "Required skills experience: ... 1 year"). EN та UA формулювання —
    # Djinni нерідко пише вимоги прямим текстом в описі обома мовами.
    - "1+ year"
    - "1+ years"
    - "1-2 years"
    - "minimum 1 year"
    - "at least 1 year"
    - "from 1 year"
    - "only from 1 year"
    - "1 year of experience"
    - "1 year experience"
    - "від 1 року"
    - "від 1-го року"
    - "мінімум 1 рік"
    - "1 рік досвіду"

    # Advanced Academic Requirements (if not relevant)
    - "PhD"
    - "Ph.D."

    # English Level Requirements — виключаємо вакансії, що прямо
    # вимагають рівень B2 і вище (2026-09-22, той самий приклад
    # вакансії: "Required languages: English B2 - Upper Intermediate").
    # "Upper-Intermediate" додано окремо, бо саме так Djinni підписує
    # рівень B2 у власному інтерфейсі.
    - "English B2"
    - "B2 - Upper Intermediate"
    - "B2 Upper Intermediate"
    - "Upper-Intermediate"
    - "Англійська B2"
    - "англійська на рівні B2"

# Джерела, які потрібно опитувати. can_disable дозволяє швидко
# вимкнути джерело, якщо його розмітка зламалась, не видаляючи конфіг.
sources:
  djinni:
    enabled: true
  dou:
    enabled: true
  remoteok:
    enabled: true
  weworkremotely:
    enabled: true
  robota_ua:
    enabled: true
  work_ua_email:
    enabled: true
    # Читає email-сповіщення "збереженого пошуку" work.ua через IMAP
    # (окрема Gmail-скринька), а не пряме HTML-скрапінг сайту. Працює
    # паралельно з work_ua вище — дублі прибирає dedup.py.
    # Потребує GitHub Secrets: WORK_UA_EMAIL_ADDRESS, WORK_UA_EMAIL_APP_PASSWORD.
    # Деталі механіки — див. docstring src/scrapers/work_ua_email.py.
  nofluffjobs:
    enabled: true
  justremote:
    enabled: true
  indeed:
    enabled: true
  linkedin_alerts:
    enabled: true
    # Встав сюди РЕАЛЬНІ RSS-посилання своїх Google Alerts (див.
    # SETUP.md, крок 4) — зараз тут порожньо: попередні значення
    # ("перше"/"друге"/"третє") були заглушками, а не робочими URL,
    # і до того ж лежали поза цим блоком (feed_urls ігнорувався).
    # Приклад запиту в Google Alerts: site:linkedin.com/jobs "AI Engineer" remote
    feed_urls: []
  remotive:
    enabled: true
  himalayas:
    enabled: true

# Google Sheets, куди пишеться таблиця (колонки A-E: дата, назва,
# компанія, джерело, посилання). Match Score / CV / причина прибрані
# разом з усім шаром матчингу (2026-09-20). Колонки F-J (CANVA/EN/
# На адаптацію/Виконано/Feedback) заповнюються вручну.
google_sheets:
  spreadsheet_id: "1RYP2ub_m7sCtag-MLuZKeukyUhn9WkzvMRKnZ52jeDw"
  worksheet_name: "Vacancies"

telegram:
  # chat_id можна лишити порожнім і взяти з секрету TELEGRAM_CHAT_ID
  parse_mode: "HTML"

# Часове вікно звіту (для довідки). Фактичний запуск керується ЗОВНІШНІМ
# тригером cron-job.org (POST workflow_dispatch о 9:00 Europe/Kyiv) —
# внутрішній розклад (`schedule:`) у .github/workflows/daily_job_search.yml
# видалено: саме він, поряд із зовнішнім тригером, спричиняв подвійні/
# запізнілі запуски (наприклад, звіт о 17:10 замість ранку).
report_window:
  timezone: "Europe/Kyiv"
  start: "09:00"
  end: "10:00"
