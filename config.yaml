# ==========================================================
# Конфігурація агента пошуку вакансій
# ==========================================================

# Три яруси пріоритету. Пошук не звужується — усі три яруси опитуються
# паралельно, різниця лише в тому, що Tier 1 завжди йде найвище у звіті
# (Google Sheets / Telegram), незалежно від Match Score.
keywords:
  tier1:  # швидкий дохід — найвищий пріоритет
    - "iOS Developer"
    - "Swift"
    - "Senior iOS"
    - "iOS Contract"
    - "Freelance iOS"
  tier2:  # будь-яка стабільна робота — існуючий список, нічого не видалено
    - "стажер"
    - "intern"
    - "data manager"
    - "data analyst"
    - "data quality"
  tier3:  # стратегічна ціль — довгостроковий напрям, менш терміновий
    - "AI Engineer"
    - "Applied AI"
    - "ML Engineer"
    - "Prompt Engineer"
    - "AI Agent Developer"
    - "LLM Engineer"
    - "Machine Learning"

# Джерела, які потрібно опитувати. can_disable дозволяє швидко
# вимкнути джерело, якщо його розмітка зламалась, не видаляючи конфіг.
sources:
  djinni:
    enabled: true
  dou:
    enabled: true
  remoteok:
    enabled: true
  weworkremotely:
    enabled: true
  robota_ua:
    enabled: true
  work_ua:
    enabled: true
  nofluffjobs:
    enabled: true
  justremote:
    enabled: true
  indeed:
    enabled: true
  linkedin_alerts:
    enabled: true
    # Встав сюди RSS-посилання своїх Google Alerts (див. SETUP.md, крок 5).
    # Приклад запиту в Google Alerts: site:linkedin.com/jobs "data analyst" remote
    feed_urls: []
  remotive:
    enabled: true
  himalayas:
    enabled: true

# Вакансії, що містять будь-яке з цих слів (у заголовку чи описі), повністю
# виключаються зі звіту — незалежно від ярусу чи Match Score. Порівняння
# без урахування регістру.
exclude_keywords:
  - "deftech"
  - "військовослужбовець"

# Тільки для Tier 2/3 (Tier 1/iOS — без обмежень). Виключає вакансії
# рівня Middle/Senior — шукаємо саме позиції для входу без досвіду.
tier23_exclude_keywords:
  - "Middle"
  - "Senior"
  - "Lead"
  - "Head of"
  
# Google Sheets, куди пишеться таблиця (колонки A-K; L "Виконано" — вручну)
google_sheets:
  spreadsheet_id: "1RYP2ub_m7sCtag-MLuZKeukyUhn9WkzvMRKnZ52jeDw"
  worksheet_name: "Vacancies"

# Google Drive, звідки читаються 12 резюме (.pdf)
google_drive:
  resumes_folder_id: "16wjJ0UDPk28jcX6jcllsvjWxrkPi0qIP"

# Локальний матчинг без AI: ваги для розрахунку Match Score
matching:
  min_score_to_report: 30   # % — вакансії нижче цього порогу не потрапляють у звіт
  title_weight: 2.0          # збіг ключового слова в заголовку резюме важить більше
  body_weight: 1.0
  # Опційне збагачення через Gemini API (безкоштовний тариф), лише для
  # вакансій, що вже пройшли min_score_to_report. Якщо немає секрету
  # GEMINI_API_KEY — агент просто працює без цього кроку, без помилок.
  use_gemini_enrichment: true
  gemini_model: "gemini-3.5-flash"

telegram:
  # chat_id можна лишити порожнім і взяти з секрету TELEGRAM_CHAT_ID
  parse_mode: "HTML"

# Часове вікно звіту (для довідки; фактичний запуск керується GitHub Actions cron)
report_window:
  timezone: "Europe/Kyiv"
  start: "09:00"
  end: "10:00"
